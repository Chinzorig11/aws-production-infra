name: Security Scan

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 8am
  workflow_dispatch:

jobs:
  scan:
    name: "Weekly Security Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: tfsec scan
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          additional_args: --format json --out results.json
          soft_fail: true

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: tfsec-results
          path: results.json
